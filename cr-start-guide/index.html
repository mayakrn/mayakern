  <style>

    main{padding:28px clamp(22px,5vw,75px) 45px;min-width:0}.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:13px;color:var(--muted);margin-bottom:30px}.badge{display:inline-flex;align-items:center;gap:7px;border:1px solid #d7e4dd;background:#fff;border-radius:50px;padding:7px 13px;font-weight:700;color:#286653}.dot{height:7px;width:7px;border-radius:50%;background:#2ca782}.counter{font-weight:700}.progress{height:5px;background:#dfebea;border-radius:8px;overflow:hidden;margin-bottom:37px}.progress span{display:block;height:100%;background:var(--green);border-radius:8px;transition:width .3s}
    .layout{max-width:1200px;margin:auto;display:grid;grid-template-columns:minmax(0,1fr) minmax(290px,390px);gap:clamp(22px,4vw,52px);align-items:start}.content{min-width:0}.eyebrow{font-size:12px;letter-spacing:.17em;text-transform:uppercase;font-weight:850;color:var(--green);margin:2px 0 14px}.content h1{font-size:clamp(34px,4.4vw,62px);letter-spacing:-.055em;line-height:1.06;margin:0 0 20px;max-width:700px}.lead{font-size:clamp(17px,1.7vw,20px);color:#51636a;max-width:650px;line-height:1.55;margin:0 0 28px}.choice-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:25px 0 28px}.choice{min-height:104px;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:17px 18px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 3px 13px rgba(15,43,41,.03);transition:.18s}.choice:hover,.choice:focus-visible{border-color:#52a78e;transform:translateY(-2px)}.choice.selected{border-color:var(--green);background:#effaf4;box-shadow:inset 0 0 0 1px var(--green)}.choice strong{font-size:16px}.choice small{font-size:13px;color:var(--muted)}.choice-icon{font-size:24px;line-height:1}.field-label{display:block;font-size:13px;font-weight:800;margin:26px 0 9px}.name-field{width:min(100%,470px);padding:16px 18px;border:1.5px solid var(--line);border-radius:13px;background:white;outline:none}.name-field:focus{border-color:var(--green);box-shadow:0 0 0 4px #d5f2e6}.hint{font-size:13px;color:var(--muted);margin-top:8px}.actions{display:flex;align-items:center;flex-wrap:wrap;gap:11px;margin-top:29px}.primary,.secondary,.textbtn{border-radius:11px;padding:13px 20px;font-weight:800}.primary{border:1px solid var(--gold);background:var(--gold);color:#183032;box-shadow:0 7px 18px rgba(227,158,6,.17)}.primary:hover{background:#ffd062}.primary:disabled{opacity:.48;cursor:not-allowed;box-shadow:none}.secondary{border:1px solid #c8d7d6;background:#fff;color:var(--ink)}.secondary:hover{background:#edf4f1}.textbtn{border:0;background:transparent;color:var(--green);padding-left:4px}.textbtn:hover{text-decoration:underline}.mini-note{font-size:13px;color:var(--muted);margin-top:24px;max-width:650px}
    #content:has(.choice-grid) h1{font-size:clamp(32px,3.4vw,48px)}.stage{background:var(--dark);color:#fff;border-radius:24px;padding:22px;box-shadow:var(--shadow);position:relative;overflow:hidden;min-height:420px}.stage:before{content:"";position:absolute;width:260px;height:260px;right:-120px;top:-120px;border-radius:50%;border:50px solid rgba(255,189,41,.08)}.stage-top{display:flex;justify-content:space-between;align-items:center;color:#adcbc3;font-size:12px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;margin-bottom:27px}.stage .mark{width:28px;height:28px;border-radius:8px;font-size:12px}.stage-panel{position:relative;background:#fff;color:var(--ink);border-radius:17px;padding:19px;box-shadow:0 10px 25px rgba(0,0,0,.12)}.stage-panel h3{font-size:16px;margin:0 0 4px}.stage-panel p{font-size:12px;color:var(--muted);margin:0 0 15px}.mini-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-top:1px solid #e6ecec;font-size:13px}.mini-row b{font-size:13px}.mini-row em{font-style:normal;color:var(--green);font-weight:800}.mini-pill{font-size:11px;font-weight:800;padding:4px 8px;border-radius:20px;background:var(--pale);color:var(--green)}.stage-caption{position:relative;color:#b5d0c8;font-size:13px;margin-top:18px}.stage-caption strong{color:#fff}.route{display:flex;align-items:center;gap:8px;margin:15px 0 17px}.route-point{width:9px;height:9px;border-radius:50%;background:var(--green);flex:none}.route-line{height:2px;background:repeating-linear-gradient(to right,#b0c6c2 0,#b0c6c2 7px,transparent 7px,transparent 12px);flex:1}.route-labels{display:flex;justify-content:space-between;font-size:12px;font-weight:700}.mock-tile{background:#f5f8f7;border-radius:11px;padding:12px;margin:9px 0;font-size:13px}.mock-tile strong{display:block}.mock-tile small{color:var(--muted)}
    .info-block{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 20px;margin:21px 0}.info-block h3{margin:0 0 8px;font-size:16px}.info-block p{margin:0;color:var(--muted);font-size:14px}.value-card{background:#e9f6ee;border:1px solid #a9d8bd;border-radius:17px;padding:20px 22px;margin:20px 0}.value-card .label{font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--green);font-weight:900}.value-card h3{font-size:22px;line-height:1.2;margin:9px 0}.value-card p{color:#3f6157;font-size:14px;margin:0}.feature-list{display:grid;gap:10px;margin:23px 0}.feature{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 17px;display:flex;gap:12px}.feature-icon{display:grid;place-items:center;width:29px;height:29px;border-radius:9px;background:var(--pale);color:var(--green);font-weight:900;flex:none}.feature strong{display:block;font-size:15px}.feature p{font-size:13px;color:var(--muted);margin:3px 0 0}.summary{background:#fff;border:1px solid var(--line);border-radius:18px;padding:24px;margin:24px 0}.summary h3{margin:0 0 17px}.summary ol{margin:0;padding-left:21px}.summary li{padding:0 0 14px 7px}.summary li:last-child{padding-bottom:0}.summary li strong{display:block}.summary li span{color:var(--muted);font-size:14px}.linkline{display:flex;flex-wrap:wrap;gap:11px;margin:22px 0}.deep-link{display:inline-flex;align-items:center;gap:7px;border:1px solid #cddeda;background:#fff;border-radius:10px;padding:10px 13px;font-weight:700;font-size:13px;text-decoration:none}.deep-link:hover{border-color:var(--green);color:var(--green)}.footer{max-width:1200px;margin:50px auto 0;border-top:1px solid #dbe5e3;padding-top:17px;display:flex;justify-content:space-between;gap:14px;color:var(--muted);font-size:12px}.footer a{text-underline-offset:2px}
    .money-big{font-size:clamp(34px,4vw,54px);font-weight:900;letter-spacing:-.05em;line-height:1.05;margin:16px 0 4px;color:#173c36}.money-unit{color:var(--muted);font-size:13px;font-weight:700;margin-bottom:17px}.calc-fields{display:grid;gap:13px;margin:25px 0}.calc-field{display:block;background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px 16px}.calc-field>span{display:block;color:var(--muted);font-weight:700;font-size:13px;margin-bottom:7px}.calc-input{display:flex;align-items:center;gap:10px}.calc-input input{min-width:0;width:100%;border:0;outline:0;color:var(--ink);font-size:23px;font-weight:800;background:transparent;appearance:textfield;-moz-appearance:textfield}.calc-input input::-webkit-inner-spin-button,.calc-input input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}.calc-input b{font-size:14px;color:var(--green);white-space:nowrap}.calc-field:focus-within{border-color:var(--green);box-shadow:0 0 0 3px #d8efe4}.calc-result{background:#e9f6ee;border:1px solid #a9d8bd;border-radius:17px;padding:18px 21px;display:grid;gap:3px}.calc-result .label{font-size:11px;color:var(--green);text-transform:uppercase;letter-spacing:.14em;font-weight:900}.calc-result strong{font-size:clamp(28px,3vw,39px);line-height:1.2;letter-spacing:-.04em}.calc-result span{font-weight:750;font-size:14px}.calc-result small{color:#567269;font-size:12px;margin-top:5px}.summary p{margin:0;color:#52666b}.value-card p{line-height:1.55}
    @media(max-width:900px){.app{display:block}.rail{min-height:auto;padding:16px 22px;display:block}.rail .brand-sub,.rail-title,.step-list,.rail-bottom{display:none}.logo{font-size:17px}.mark{width:32px;height:32px}main{padding-top:19px}.layout{grid-template-columns:1fr}.stage{min-height:auto;max-width:600px}.progress{margin-bottom:27px}}@media(max-width:560px){.topbar{font-size:11px}.badge{padding:5px 9px}.content h1{font-size:35px}.lead{font-size:16px}.choice-grid{grid-template-columns:1fr}.choice{min-height:83px}.sim-action{align-items:flex-start}.sim-arrow{white-space:normal;text-align:right}.footer{display:block}.footer span{display:block;margin-bottom:7px}}
    @media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.choice,.progress span{transition:none}}
    .signal{border-radius:15px;padding:15px 18px;margin:12px 0;display:grid;gap:3px}.signal strong{font-size:13px;text-transform:uppercase;letter-spacing:.09em}.signal span{font-size:15px;line-height:1.45}.loss{background:#fff0ed;border:1px solid #efb8ae;color:#8e2e24}.gain{background:#e7f6ea;border:1px solid #abd9b6;color:#176b3d}.loss-text{color:#bd4439!important}.gain-text{color:#17764b!important}.action-link{text-decoration:none;display:inline-flex;align-items:center}.money-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:22px 0}.money-card{padding:16px;border-radius:15px;display:grid;gap:4px}.money-card span{font-size:13px;font-weight:800}.money-card strong{font-size:clamp(24px,2.6vw,37px);line-height:1.1;letter-spacing:-.04em}.money-card small{font-size:11px;line-height:1.4;opacity:.85}.total-gain{background:#0e6848;color:white;border-radius:18px;padding:20px;display:grid;gap:4px;margin:16px 0}.total-gain span{font-weight:750;font-size:14px}.total-gain strong{font-size:clamp(32px,4vw,50px);letter-spacing:-.04em;line-height:1.1}.tech-tabs{display:grid;gap:8px;margin:18px 0}.tech-tabs button{text-align:left;border:1px solid #c9d8d3;background:white;border-radius:11px;padding:12px 16px;font-weight:750;color:#27463c}.tech-tabs button.selected{border-color:#26815a;background:#e8f6ed;color:#176b3d}.tech-tabs button:hover{border-color:#26815a}@media(max-width:620px){.money-grid{grid-template-columns:1fr}}
    #content:has(.money-grid) h1{font-size:clamp(34px,3.6vw,52px)}
  </style>
</head>
<body>
<div class="app">
  <aside class="rail" aria-label="Этапы знакомства">
    <div><a class="logo" href="#" id="homeLink"><span class="mark">CR</span><span>START</span></a><div class="brand-sub">Первый рейс</div></div>
    <div><div class="rail-title">Ваш маршрут</div><nav class="step-list" id="stepList" aria-label="Шаги"></nav></div>
    <div class="rail-bottom">Кликабельный прототип помощника. <a href="https://demo.cargorun.ru/" target="_blank" rel="noopener">Открыть демо CR Start ↗</a></div>
  </aside>
  <main>
    <div class="topbar"><span class="badge"><span class="dot"></span> Знакомство с CR Start</span><span class="counter" id="counter"></span></div>
    <div class="progress" aria-label="Прогресс знакомства"><span id="progressBar"></span></div>
    <div class="layout"><div class="content" id="content" aria-live="polite"></div><div class="stage" id="stage" aria-label="Иллюстрация возможностей"></div></div>
    <div class="footer"><span>Концепт онбординга • ноябрь 2026</span><span>Основано на <a href="https://demo.cargorun.ru/" target="_blank" rel="noopener">демо-стенде</a> и <a href="https://cargorun.ru/start/" target="_blank" rel="noopener">описании CR Start</a>. Макеты экранов иллюстративные.</span></div>
  </main>
</div>
<script>
const steps=['Когда нужен CR Start','Где уходят деньги','Как это работает','Что можно заработать'];
const s={step:0,price:120000,cost:95000,market:130000,empty:250,target:150,emptyCost:35,trips:8,tech:0};
const fmt=n=>new Intl.NumberFormat('ru-RU',{maximumFractionDigits:0}).format(Math.round(n));
const rub=n=>`${fmt(n)} ₽`;
const el=id=>document.getElementById(id);
const val=(label,key,suffix='₽')=>`<label class="calc-field"><span>${label}</span><div class="calc-input"><input type="number" min="0" max="100000000" inputmode="numeric" data-key="${key}" value="${s[key]}"><b>${suffix}</b></div></label>`;
const btn=(label,to,secondary=false)=>`<button class="${secondary?'secondary':'primary'}" data-next="${to}">${label}</button>`;
function calc(){let margin=s.price-s.cost,rateGap=Math.max(0,s.market-s.price),emptySpend=s.empty*s.emptyCost,kmSaved=Math.max(0,s.empty-s.target),saving=kmSaved*s.emptyCost,upside=rateGap+saving;return{margin,rateGap,emptySpend,kmSaved,saving,upside,monthlyRate:rateGap*s.trips,monthlySaving:saving*s.trips,monthlyUpside:upside*s.trips,after:margin+upside};}
function stage(title,subtitle,body,caption){return `<div class="stage-top"><span>CR START · ПРИМЕР</span><span class="mark">CR</span></div><div class="stage-panel"><h3>${title}</h3><p>${subtitle}</p>${body}</div><div class="stage-caption">${caption}</div>`;}
function row(label,value,tone=''){return `<div class="mini-row"><b>${label}</b><em class="${tone}">${value}</em></div>`;}
function stageView(){const c=calc();if(s.step===0)return stage('Один рейс · Москва → Казань','Транспортная компания со своим парком',row('Ставка клиента',rub(s.price))+row('Прямые затраты',rub(s.cost))+row('Порожний пробег',`${fmt(s.empty)} км`),'Вопрос владельца: сколько денег этот рейс оставит и где можно заработать больше?');if(s.step===1)return stage('Две денежные утечки','На один типовой рейс',row('Недобор к ориентиру ставки',rub(c.rateGap),'loss-text')+row('Расход на порожний пробег',rub(c.emptySpend),'loss-text')+row('Маржа сейчас',rub(c.margin)),'Красным — недополученная ставка и текущие затраты. Это разные статьи: их нельзя просто сложить как убыток.');if(s.step===2){let views=[['До назначения','Маршрут, себестоимость и средняя ставка по направлению','Ставка ниже ориентира — можно проверить цену до согласования.'],['После выгрузки','Рекомендации следующих загрузок','Следующий заказ помогает уменьшить порожний путь.'],['В работе','Водитель, мониторинг и документы','Один рейс виден от заявки до оплаты.']];let v=views[s.tech];return stage(v[0],v[1],row('Заявка','Москва → Казань')+row('Потенциал по ставке',`+${rub(c.rateGap)}`,'gain-text')+row('Экономия на пустом ходе',`+${rub(c.saving)}`,'gain-text'),v[2]);}return stage('Результат на одну машину','При '+fmt(s.trips)+' похожих рейсах в месяц',row('Дополнительная выручка',`+${rub(c.monthlyRate)}`,'gain-text')+row('Снижение затрат',`+${rub(c.monthlySaving)}`,'gain-text')+row('Резерв валовой прибыли',`+${rub(c.monthlyUpside)}`,'gain-text'),'Сценарий, а не обещание: условия заказов и фактический пробег могут отличаться.');}
function render(){const c=calc();el('counter').textContent=`Шаг ${s.step+1} из 4`;el('progressBar').style.width=`${(s.step+1)*25}%`;el('stepList').innerHTML=steps.map((x,i)=>`<button class="step-item ${i===s.step?'active':i<s.step?'done':''}" data-step="${i}" ${i>s.step?'disabled':''}><span class="step-num">${i<s.step?'✓':i+1}</span>${x}</button>`).join('');el('stage').innerHTML=stageView();let h='';
if(s.step===0)h=`<div class="eyebrow">Владелец небольшой транспортной компании · свой парк</div><h1>Рейсы идут. А где бизнес теряет деньги?</h1><p class="lead">CR Start — облачная система для перевозчика: заявки, машины, водители и деньги в одном месте. Она нужна, когда вы растёте, а ставки, пробег и расходы всё ещё собираете по чатам и таблицам.</p><div class="signal loss"><strong>Потеря</strong><span>Взяли рейс ниже рыночной ставки или отправили машину обратно пустой — деньги ушли незаметно.</span></div><div class="signal gain"><strong>Возможность</strong><span>Проверить экономику до рейса, найти следующую загрузку и увеличить валовую прибыль на той же машине.</span></div><div class="actions">${btn('Показать потери на цифрах →',1)}<a class="secondary action-link" href="https://demo.cargorun.ru/" target="_blank" rel="noopener">Открыть демо ↗</a></div><p class="mini-note">Покажем на учебном рейсе. Для оценки своего бизнеса поменяйте исходные цифры на следующем шаге.</p>`;
if(s.step===1)h=`<div class="eyebrow">Шаг 2 · денежная диагностика</div><h1>Где деньги уходят сейчас</h1><p class="lead">Возьмём типовой рейс одной машины. Измените значения на свои — красные суммы пересчитаются сразу.</p><div class="calc-fields">${val('Оплата клиента за рейс','price')}${val('Прямые затраты на рейс, включая пустой ход','cost')}${val('Ориентир ставки по направлению','market')}${val('Порожний пробег','empty','км')}${val('Стоимость 1 км порожнего пути','emptyCost','₽/км')}</div><div class="money-grid"><div class="money-card loss"><span>Недобор к ориентиру ставки</span><strong data-rate-gap>${rub(c.rateGap)}</strong><small>Ориентир − текущая ставка</small></div><div class="money-card loss"><span>Текущий расход на пустой ход</span><strong data-empty-spend>${rub(c.emptySpend)}</strong><small>Порожние км × стоимость км; уже входит в прямые затраты</small></div></div><p class="mini-note">Ориентир ставки здесь учебный. CR Start показывает среднюю ставку по направлению. Разница со ставкой — возможность для проверки, а не гарантированная потеря.</p><div class="actions">${btn('Как сервис влияет на эти суммы →',2)}${btn('← Назад',0,true)}</div>`;
if(s.step===2)h=`<div class="eyebrow">Шаг 3 · технология без сложного внедрения</div><h1>Одна заявка запускает цепочку действий</h1><p class="lead">Логист вносит рейс один раз. CR Start рассчитывает маршрут и себестоимость, показывает среднюю ставку и риски, предлагает следующие загрузки, отправляет задание водителю и собирает данные для отчётов.</p><div class="tech-tabs"><button data-tech="0" class="${s.tech===0?'selected':''}">1. Проверить ставку</button><button data-tech="1" class="${s.tech===1?'selected':''}">2. Найти следующий рейс</button><button data-tech="2" class="${s.tech===2?'selected':''}">3. Провести перевозку</button></div><div class="value-card"><div class="label">${['До согласования','После выгрузки','От заявки до оплаты'][s.tech]}</div><h3>${['Маршрут, себестоимость, ставка рынка и риски','Рекомендации загрузок для следующего рейса','Водитель, статусы, документы и отчёты'][s.tech]}</h3><p>${['Можно заметить слабую ставку до того, как машина выехала.','Можно планировать следующий заказ и сокращать пустой путь.','Можно видеть выполнение и деньги по каждому рейсу.'][s.tech]}</p></div><p class="mini-note">Начать можно с одного своего заказа. Расчёты и действия ниже — иллюстрация возможностей, а не доступ к данным демо-стенда.</p><div class="actions">${btn('Посмотреть возможный заработок →',3)}${btn('← К потерям',1,true)}</div>`;
if(s.step===3)h=`<div class="eyebrow">Шаг 4 · эффект для бизнеса</div><h1>Сколько можно получить сверху?</h1><p class="lead">Сценарий для одной машины и ${fmt(s.trips)} похожих рейсов в месяц. Зелёным — потенциал, который складывается из дополнительной выручки и сокращения затрат.</p><div class="calc-fields">${val('Похожих рейсов в месяц на одну машину','trips','рейсов')}${val('Порожний пробег после планирования','target','км')}</div><div class="money-grid"><div class="money-card gain"><span>Дополнительная выручка от ставки</span><strong data-monthly-rate>+${rub(c.monthlyRate)}</strong><small data-rate-formula>${rub(c.rateGap)} × ${fmt(s.trips)} рейсов</small></div><div class="money-card gain"><span>Сокращение затрат на пустой ход</span><strong data-monthly-saving>+${rub(c.monthlySaving)}</strong><small>${fmt(c.kmSaved)} км × ${rub(s.emptyCost)} × ${fmt(s.trips)} рейсов</small></div></div><div class="total-gain"><span>Резерв роста валовой прибыли на одну машину в месяц</span><strong data-monthly-upside>+${rub(c.monthlyUpside)}</strong></div><p class="mini-note">Это модель, а не обещание дохода: ставка должна быть согласована клиентом, следующий рейс найден, а пустой путь реально сокращён. Прямые затраты уже включают порожний пробег; в расчёте добавлена только экономия от сокращённых километров. Общие расходы и налоги не учтены.</p><div class="actions"><a class="primary action-link" href="https://demo.cargorun.ru/" target="_blank" rel="noopener">Попробовать на своём рейсе ↗</a>${btn('← Как это работает',2,true)}</div>`;
el('content').innerHTML=h;window.scrollTo({top:0,behavior:'smooth'});}
document.addEventListener('click',e=>{let x=e.target.closest('[data-next]');if(x){s.step=Number(x.dataset.next);render();return;}x=e.target.closest('[data-step]');if(x&&Number(x.dataset.step)<s.step){s.step=Number(x.dataset.step);render();return;}x=e.target.closest('[data-tech]');if(x){s.tech=Number(x.dataset.tech);render();}});
document.addEventListener('input',e=>{const x=e.target.closest('[data-key]');if(!x)return;const k=x.dataset.key;s[k]=Math.min(100000000,Math.max(0,Number(x.value)||0));const c=calc();el('stage').innerHTML=stageView();if(s.step===1){el('content').querySelector('[data-rate-gap]').textContent=rub(c.rateGap);el('content').querySelector('[data-empty-spend]').textContent=rub(c.emptySpend);}if(s.step===3){el('content').querySelector('[data-monthly-rate]').textContent=`+${rub(c.monthlyRate)}`;el('content').querySelector('[data-monthly-saving]').textContent=`+${rub(c.monthlySaving)}`;el('content').querySelector('[data-monthly-upside]').textContent=`+${rub(c.monthlyUpside)}`;el('content').querySelector('[data-rate-formula]').textContent=`${rub(c.rateGap)} × ${fmt(s.trips)} рейсов`;el('content').querySelectorAll('.money-card small')[1].textContent=`${fmt(c.kmSaved)} км × ${rub(s.emptyCost)} × ${fmt(s.trips)} рейсов`;}});
document.addEventListener('input',e=>{if(e.target.matches('[data-key="trips"]')&&s.step===3)el('content').querySelector('.lead').textContent=`Сценарий для одной машины и ${fmt(s.trips)} похожих рейсов в месяц. Зелёным — потенциал, который складывается из дополнительной выручки и сокращения затрат.`;});
el('homeLink').addEventListener('click',e=>{e.preventDefault();s.step=0;render();});render();

</script>
</body>
</html>
